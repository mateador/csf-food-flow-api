services:
  - type: web
    name: csf-food-flow-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.app
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LOGIN_CODE_TTL_MINUTES
        value: "10"
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "720"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
